name: test

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m compileall -q skills/ai-writing-risk-review/scripts
      - name: Run portable self-test
        run: PYTHONDONTWRITEBYTECODE=1 python skills/ai-writing-risk-review/scripts/self_test.py
